name: Deploy All

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:

jobs:
  deploy-cli:
    uses: ./.github/workflows/publish-cli.yml
    secrets: inherit

  deploy-vscode:
    runs-on: ubuntu-latest
    needs: deploy-cli
    defaults:
      run:
        working-directory: ./vscode-extension/openclaude-vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Package Extension
        run: vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        run: vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudex-vscode-extension
          path: 'vscode-extension/openclaude-vscode/*.vsix'
